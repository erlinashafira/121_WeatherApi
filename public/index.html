<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation</title>
</head>

<style>
    body { 
        font-family: Arial, sans-serif; 
        background: #eaf6ff; 
        margin: 0; 
        padding: 30px; }
    
    .container { 
        width: 500px; 
        margin: auto; 
        background: white; 
        padding: 25px; 
        border-radius: 15px; 
        box-shadow: 0 5px 15px rgba(0,0,0,0.1); } 
    
    h2 { 
        text-align: center; 
        margin-bottom: 25px; } 
    
    .input-area { 
        display: flex; 
        gap: 10px; 
        margin-bottom: 20px; }

    .input-area input { 
        flex: 1; 
        padding: 10px; 
        border: 1px solid #ccc; 
        border-radius: 8px; } 
        
    .input-area button { 
        padding: 10px 18px; 
        border: none; 
        border-radius: 8px; 
        background: #a4deeb; 
        color: white; 
        cursor: pointer; } 
        
    .input-area button:hover { 
        background: #ffffff; } 
        
    .weather-box { 
        display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 12px; } 
    
    .item { 
        background: #ffffff; 
        padding: 15px; 
        border-radius: 10px; 
        border-left: 4px solid #ffffff; } 
    
    .item p { 
        margin: 5px 0; } 
        
    .label { 
        font-size: 13px; 
        color: #777; } 
    
    .value { 
        font-size: 17px; 
        font-weight: bold; } 
    
    .temperature { 
        grid-column: span 2; 
        text-align: center; 
        background: #a4deeb; 
        padding: 20px; 
        border-radius: 12px; } 
    
    .temperature .value { 
        font-size: 32px; 
        color: #ffffff; } 
        
        </style> 
    </head> 

    <body> 

        <div class="container">

            <h2>Informasi Cuaca!</h2>

    <h3> Nama : Erlina Shafira Indriani</h3>
    <h3> NIM : 20240140121</h3>
        
    <div class="input-area"> 
        <input type="text" 
        id="lokasi" 
        placeholder="Masukkan lokasi..." > 
        
        <button onclick="cariLokasi()">Cari</button> 
    </div>
    
   <div class="weather-box"> 
    <div class="item"> 
        <p class="label">Negara</p> 
        <p class="value" id="negara">-</p> 
    </div> 
    
    <div class="item"> 
        <p class="label">Provinsi</p> 
        <p class="value" id="provinsi">-</p> 
    </div> 
    
    <div class="item"> 
        <p class="label">Kecamatan</p> 
        <p class="value" id="kecamatan">-</p> 
    </div> 
    
    <div class="item"> 
        <p class="label">Lokasi</p> 
        <p class="value" id="kota">-</p> 
    </div> 
    
    <div class="temperature"> 
        <p class="label">Suhu</p> 
        <p class="value"> 
            <span id="suhu">-</span> °C </p> 
        </div> 
        
    <div class="item"> 
        <p class="label">Longitude</p> 
        <p class="value" id="longitude">-</p> 
    </div> 
    
    <div class="item"> 
        <p class="label">Latitude</p> 
        <p class="value" id="latitude">-</p> 
    </div>
  
    <script>
        function cariLokasi() {

        const lokasi = document.getElementById("lokasi").value;

        fetch("/api/lokasi?lokasi=" + encodeURIComponent(lokasi))
        .then((response) => response.json())
        .then((data) => {
            console.log(data);

            document.getElementById("kota").innerHTML = data.kota; 
            document.getElementById("negara").innerHTML = data.negara; 
            document.getElementById("provinsi").innerHTML = data.provinsi; 
            document.getElementById("kecamatan").innerHTML = data.kecamatan; 
            document.getElementById("suhu").innerHTML = data.suhu; 
            document.getElementById("longitude").innerHTML = data.longitude; 
            document.getElementById("latitude").innerHTML = data.latitude;
        })

        .catch((error) => {

            console.error("Error:");

        });
    
        }
        
    </script>

</body>
</html>
